name: seedfinder
description: Ad-free torrent search for iOS. Searches public indexes and hands magnet links to your torrent app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  xml: ^6.5.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  flutter_inappwebview: ^6.1.5
  app_icon:
    path: packages/app_icon

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
