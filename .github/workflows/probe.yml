name: Probe sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe.sh]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every candidate source
        run: bash tools/probe.sh probe-out
      - name: Save results to the probe-results branch
        run: |
          cd probe-out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b probe-results
          git add -A
          git commit -q -m "Probe results"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
