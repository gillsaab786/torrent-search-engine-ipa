name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/**'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --org com.gillsaab --project-name seedfinder .
          # Remove the generator's sample test; it references a class this app doesn't have.
          rm -f test/widget_test.dart

      - name: Configure iOS project
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Torrent Search Engine'" $PLIST || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Torrent Search Engine'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Used for voice search.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Turns your voice into a search query.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string magnet" $PLIST
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile || true
          cat $PLIST

      - name: Set app icon
        run: |
          SET=ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in "$SET"/*.png; do
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            sips -z "$W" "$W" assets/icon.png --out "$f" > /dev/null
          done
          ls "$SET"

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: |
          # Post every error/warning as an annotation so it shows in the run summary.
          set +e
          flutter analyze --format=machine > analyze.txt 2>&1
          STATUS=$?
          set -e
          cat analyze.txt
          while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in
              ERROR) echo "::error file=${file#$PWD/},line=$line,col=$col::$code: $msg" ;;
              WARNING) echo "::warning file=${file#$PWD/},line=$line,col=$col::$code: $msg" ;;
            esac
          done < analyze.txt
          if grep -q '^ERROR|' analyze.txt; then exit 1; fi

      - name: Test source parsers
        run: flutter test --reporter github

      - name: Build app (unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --build-name "$APP_VERSION" --build-number "${{ github.run_number }}" 2>&1 | tee build.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ $STATUS -ne 0 ]; then
            grep -iE "error[: ]" build.txt | grep -v "^warning" | head -40 | while IFS= read -r l; do
              echo "::error::${l}"
            done
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TorrentSearchEngine.ipa Payload
          ls -lh TorrentSearchEngine.ipa

      - name: Write SideStore / AltStore source
        if: github.ref == 'refs/heads/main'
        run: |
          REPO="${{ github.repository }}"
          SIZE=$(stat -f%z TorrentSearchEngine.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > source.json <<JSON
          {
            "name": "Torrent Search Engine",
            "identifier": "com.gillsaab.seedfinder.source",
            "subtitle": "Ad-free torrent search",
            "iconURL": "https://raw.githubusercontent.com/$REPO/main/assets/icon.png",
            "apps": [
              {
                "name": "Torrent Search Engine",
                "bundleIdentifier": "com.gillsaab.seedfinder",
                "developerName": "gillsaab786",
                "subtitle": "Ad-free torrent search",
                "localizedDescription": "Search public torrent indexes with no ads and every feature included. Voice search, history, saved results, magnet copy and share.",
                "iconURL": "https://raw.githubusercontent.com/$REPO/main/assets/icon.png",
                "tintColor": "2EE6A6",
                "category": "utilities",
                "appPermissions": { "entitlements": [], "privacy": {
                  "NSMicrophoneUsageDescription": "Voice search",
                  "NSSpeechRecognitionUsageDescription": "Voice search" } },
                "versions": [
                  {
                    "version": "$APP_VERSION",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "$DATE",
                    "size": $SIZE,
                    "downloadURL": "https://github.com/$REPO/releases/download/v$APP_VERSION/TorrentSearchEngine.ipa",
                    "minOSVersion": "13.0"
                  }
                ]
              }
            ],
            "news": []
          }
          JSON
          python3 -m json.tool source.json > /dev/null && cat source.json

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" TorrentSearchEngine.ipa source.json \
            --title "Torrent Search Engine $APP_VERSION" \
            --notes "Download **TorrentSearchEngine.ipa** below and install with SideStore, AltStore or Sideloadly." \
            --latest
