name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --org com.gillsaab --project-name seedfinder .
          # Remove the generator's sample test; it references a class this app doesn't have.
          rm -f test/widget_test.dart

      - name: Configure iOS project
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Seedfinder" $PLIST || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Seedfinder" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Seedfinder uses the microphone for voice search.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Seedfinder converts your voice into a search query.'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string magnet" $PLIST
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile || true
          cat $PLIST

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: |
          # Post every error/warning as an annotation so it shows in the run summary.
          set +e
          flutter analyze --format=machine > analyze.txt 2>&1
          STATUS=$?
          set -e
          cat analyze.txt
          while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in
              ERROR) echo "::error file=${file#$PWD/},line=$line,col=$col::$code: $msg" ;;
              WARNING) echo "::warning file=${file#$PWD/},line=$line,col=$col::$code: $msg" ;;
            esac
          done < analyze.txt
          if grep -q '^ERROR|' analyze.txt; then exit 1; fi

      - name: Build app (unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee build.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ $STATUS -ne 0 ]; then
            grep -iE "error[: ]" build.txt | grep -v "^warning" | head -40 | while IFS= read -r l; do
              echo "::error::${l}"
            done
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Seedfinder.ipa Payload
          ls -lh Seedfinder.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Seedfinder-ipa
          path: Seedfinder.ipa
          retention-days: 30
